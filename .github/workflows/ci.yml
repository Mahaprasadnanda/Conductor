name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          
      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Backend Tests
        env:
          PYTHONPATH: .
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test_secret_key_for_ci
          GRAFANA_CLOUD_USERNAME: test
          GRAFANA_CLOUD_API_KEY: test
          GRAFANA_CLOUD_REMOTE_WRITE_URL: http://localhost:9999
        run: |
          cd backend
          pytest -v

  frontend-build:
    name: Frontend Build Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci
          
      - name: Build Frontend
        env:
          VITE_API_URL: https://dummy-url.for-build
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Build Backend Docker Image
        run: |
          cd backend
          docker build -t conductor-backend:test .

  deploy-backend:
    name: Deploy Backend to Render
    needs: [backend-test, frontend-build, docker-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Render Deployment
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          echo "Triggering Render deployment..."
          curl -X POST -s -f -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          
      - name: Wait for Backend Deployment
        run: |
          if [ -z "${{ secrets.PRODUCTION_BACKEND_URL }}" ]; then
            echo "Error: PRODUCTION_BACKEND_URL secret is not set."
            exit 1
          fi
          echo "Polling backend for up to 5 minutes..."
          # Strip trailing slash if present
          BACKEND_URL=$(echo "${{ secrets.PRODUCTION_BACKEND_URL }}" | sed 's:/*$::')
          
          # Retry for 5 minutes (30 * 10 seconds)
          for i in {1..30}; do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/v1/health" || true)
            if [ "$STATUS_CODE" == "200" ]; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "Attempt $i: Backend returned $STATUS_CODE. Waiting 10s..."
            sleep 10
          done
          
          echo "Backend deployment timed out or failed health check."
          exit 1

  smoke-tests:
    name: Post-Deployment Smoke Tests
    needs: [deploy-backend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Verify Backend Metrics Endpoint
        run: |
          BACKEND_URL=$(echo "${{ secrets.PRODUCTION_BACKEND_URL }}" | sed 's:/*$::')
          echo "Testing $BACKEND_URL/metrics..."
          RESPONSE=$(curl -s "$BACKEND_URL/metrics")
          if [[ -z "$RESPONSE" ]]; then
            echo "Metrics endpoint returned empty response."
            exit 1
          fi
          echo "Metrics endpoint successfully returned data."

      - name: Verify Frontend Production URL
        run: |
          if [ -z "${{ secrets.PRODUCTION_FRONTEND_URL }}" ]; then
            echo "Error: PRODUCTION_FRONTEND_URL secret is not set."
            exit 1
          fi
          
          FRONTEND_URL=$(echo "${{ secrets.PRODUCTION_FRONTEND_URL }}" | sed 's:/*$::')
          echo "Testing $FRONTEND_URL..."
          
          # Wait up to 2 minutes for Vercel deployment
          for i in {1..12}; do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL" || true)
            if [ "$STATUS_CODE" == "200" ]; then
              echo "Frontend is reachable and returned 200 OK!"
              exit 0
            fi
            echo "Attempt $i: Frontend returned $STATUS_CODE. Waiting 10s..."
            sleep 10
          done
          
          echo "Frontend smoke test failed."
          exit 1
